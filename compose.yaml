services:
  chat-app:
    build: .
    image: fastflowlm-chat:local
    ports:
      - "${CHAT_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    environment:
      FASTFLOWLM_BASE_URL: "${FASTFLOWLM_BASE_URL:-http://fastflowlm:8000}"
      CHAT_DATA_DIR: /data
    volumes:
      - chat-data:/data
    restart: unless-stopped

volumes:
  chat-data:
